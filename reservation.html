<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Reservation</title>
    <link rel="stylesheet" href="style.css"> 

</head>
<body>

    <nav class="navbar">
        <div class="logo">JSB <span>Restaurant</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#menu">Menu</a></li>
            <li><a href="reservation.html">Reservation</a></li>
            <li><a href="story.html">Our Story</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Book Your Table</h1>
            <p>Join us for an unforgettable dining experience</p>
        </div>
    </header>

    <section class="story-page">
        <div class="story-container">
            <h2 class="section-title">Table Reservation</h2>
            
            <div class="introtext">
                <p>Please fill out the form below. For parties larger than 8, please call us directly to ensure we can accommodate your group comfortably.</p>
            </div>

            <hr class="story-divider">

            <form action="#" class="reservation-form">
                <div class="menu-grid">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="email@example.com" required>
                    </div>
                </div>

                <div class="menu-grid">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="time">Time</label>
                        <input type="time" id="time" name="time" required>
                    </div>
                </div>

                <div class="menu-grid">
                    <div class="form-group">
                        <label for="guests">Number of Guests</label>
                        <select id="guests" name="guests">
                            <option value="1">1 Person</option>
                            <option value="2">2 People</option>
                            <option value="3">3 People</option>
                            <option value="4">4 People</option>
                            <option value="5">5+ People</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="000-000-0000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="requests">Special Requests (Optional)</label>
                    <textarea id="requests" name="requests" rows="4" placeholder="Allergies, special occasions, etc."></textarea>
                </div>

                <button type="submit" class="btn submit-btn">Confirm Reservation</button>
            </form>
        </div>
    </section>

</body>
</html>
